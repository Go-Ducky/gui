version: '3'

vars:
  TAGS_GTK: 'gtk'
  TAGS_QT: 'qt'

tasks:
  build:gtk:
    desc: Build the native GTK4 app
    cmds:
      - go build -tags gtk -o bin/goducky-gtk .

  build:qt:
    desc: Build the native Qt 6 app
    cmds:
      - go build -tags qt -o bin/goducky-qt .

  run:gtk:
    desc: Build and run the GTK4 app
    cmds:
      - go run -tags gtk .

  run:qt:
    desc: Build and run the Qt 6 app
    cmds:
      - go run -tags qt .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./internal/...

  fmt:
    desc: Format all Go sources
    cmds:
      - gofmt -w .