name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.27'

jobs:
  build:
    name: Build & vet
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/archlinux:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install build dependencies (GTK4 + Qt 6)
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed \
            base-devel git glib2 gobject-introspection gtk4 qt6-base

      - name: Build (default)
        run: go build -o /tmp/goducky-default .

      - name: Build (GTK4)
        run: go build -tags gtk -o /tmp/goducky-gtk .

      - name: Build (Qt 6)
        run: go build -tags qt -o /tmp/goducky-qt .

      - name: Vet
        run: go vet ./internal/...