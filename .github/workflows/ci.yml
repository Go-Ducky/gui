name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.27'

jobs:
  build:
    name: Build & vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install build dependencies (GTK4 + Qt 6)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgirepository1.0-dev \
            libgtk-4-dev libgdk-pixbuf-2.0-dev \
            qt6-base-dev libqt6widgets6

      - name: Build (default)
        run: go build -o /tmp/goducky-default .

      - name: Build (GTK4)
        run: go build -tags gtk -o /tmp/goducky-gtk .

      - name: Build (Qt 6)
        run: go build -tags qt -o /tmp/goducky-qt .

      - name: Vet
        run: go vet ./internal/...