name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_dev: ${{ steps.version.outputs.is_dev }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine version and tag
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
            IS_DEV="false"
          else
            SHORT="$(git rev-parse --short HEAD)"
            BASE="$(cat VERSION 2>/dev/null || echo 0.1.0)"
            VERSION="${BASE}-dev.${SHORT}"
            TAG="dev-${SHORT}"
            IS_DEV="true"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_dev=${IS_DEV}" >> "$GITHUB_OUTPUT"

  linux:
    name: Package Linux (GTK4) - AppImage/deb/rpm/arch
    needs: version
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/archlinux:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install GTK4 build dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed \
            base-devel git curl glib2 gobject-introspection gtk4

      - name: Build native GTK4 binary
        run: |
          go build -tags gtk -trimpath -ldflags "-s -w" -o bin/goducky-linux-amd64 .

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Package .deb, .rpm and Arch pkg
        run: |
          mkdir -p dist
          cat > /tmp/nfpm.yaml <<EOF
          name: goducky
          arch: amd64
          platform: linux
          version: ${VERSION}
          release: 1
          description: "GoDucky GUI - AI coding agent, desktop edition"
          homepage: "https://github.com/Go-Ducky/gui"
          maintainer: "GoDucky <goducky@users.noreply.github.com>"
          vendor: "GoDucky"
          license: "MIT"
          section: "default"
          priority: "extra"
          contents:
            - src: bin/goducky-linux-amd64
              dst: /usr/bin/goducky
              file_info:
                mode: 0755
            - src: packaging/linux/goducky.desktop
              dst: /usr/share/applications/goducky.desktop
              file_info:
                mode: 0644
            - src: packaging/linux/goducky.png
              dst: /usr/share/icons/hicolor/128x128/apps/goducky.png
              file_info:
                mode: 0644
          overrides:
            deb:
              depends:
                - libgtk-4-1
                - libgirepository-1.0-1
            rpm:
              depends:
                - gtk4
          EOF
          nfpm pkg --config /tmp/nfpm.yaml --target "dist/goducky_${VERSION}_amd64.deb" --packager deb
          nfpm pkg --config /tmp/nfpm.yaml --target "dist/goducky-${VERSION}-1.x86_64.rpm" --packager rpm
          ls -la dist
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Build AppImage
        run: |
          mkdir -p dist AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/128x128/apps
          install -m755 bin/goducky-linux-amd64 AppDir/usr/bin/goducky
          install -m644 packaging/linux/goducky.desktop AppDir/usr/share/applications/goducky.desktop
          install -m644 packaging/linux/goducky.png AppDir/usr/share/icons/hicolor/128x128/apps/goducky.png
          cp packaging/linux/goducky.desktop AppDir/goducky.desktop
          cp packaging/linux/goducky.png AppDir/goducky.png
          install -m755 packaging/linux/AppRun AppDir/AppRun
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "dist/goducky-${VERSION}-x86_64.AppImage"
          ls -la dist
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Assemble tarball and raw binary
        run: |
          mkdir -p dist/stage/usr/bin dist/stage/usr/share/applications dist/stage/usr/share/icons/hicolor/128x128/apps
          install -m755 bin/goducky-linux-amd64 dist/stage/usr/bin/goducky
          install -m644 packaging/linux/goducky.desktop dist/stage/usr/share/applications/goducky.desktop
          install -m644 packaging/linux/goducky.png dist/stage/usr/share/icons/hicolor/128x128/apps/goducky.png
          cp bin/goducky-linux-amd64 "dist/goducky-linux-amd64"
          tar -C dist/stage -czf "dist/goducky-${VERSION}-linux-x86_64.tar.gz" usr
          rm -rf dist/stage
          ls -la dist
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*

  windows:
    name: Package Windows (Win32) - amd64/arm64
    needs: version
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/archlinux:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install mingw toolchains
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed base-devel git curl mingw-w64-toolchain

      - name: Build Win32 amd64
        run: |
          CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc GOOS=windows GOARCH=amd64 \
            go build -tags win32 -trimpath -ldflags "-H windows -s -w" \
            -o bin/goducky-windows-amd64.exe .
          ls -la bin

      - name: Package amd64 zip
        run: |
          mkdir -p dist
          cp bin/goducky-windows-amd64.exe dist/
          zip -jq "dist/goducky-${VERSION}-windows-amd64.zip" bin/goducky-windows-amd64.exe
          ls -la dist
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Build Win32 arm64
        run: |
          pacman -S --noconfirm --needed zig
          CGO_ENABLED=1 CC="zig cc -target aarch64-windows-gnu" GOOS=windows GOARCH=arm64 \
            go build -tags win32 -trimpath -ldflags "-H windows -s -w" \
            -o bin/goducky-windows-arm64.exe .
          ls -la bin

      - name: Package arm64 zip
        run: |
          zip -jq "dist/goducky-${VERSION}-windows-arm64.zip" bin/goducky-windows-arm64.exe
          ls -la dist
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*

  macos:
    name: Package macOS (Cocoa) - amd64/arm64
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: amd64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Cocoa binary
        run: |
          CGO_ENABLED=1 go build -tags cocoa -trimpath -ldflags "-s -w" \
            -o bin/goducky-darwin-${{ matrix.arch }} .
          ls -la bin

      - name: Package .app bundle zip
        run: |
          mkdir -p "GoDucky.app/Contents/MacOS" "GoDucky.app/Contents/Resources" dist
          install -m755 "bin/goducky-darwin-${{ matrix.arch }}" "GoDucky.app/Contents/MacOS/goducky"
          cp packaging/macos/Info.plist "GoDucky.app/Contents/Info.plist"
          zip -rq "dist/goducky-${VERSION}-darwin-${{ matrix.arch }}.zip" GoDucky.app
          ls -la dist
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*

  publish:
    name: Publish release
    needs: [version, linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          IS_DEV: ${{ needs.version.outputs.is_dev }}
        run: |
          set -euo pipefail
          DESCRIPTION="GoDucky GUI v${VERSION}

          Native installers for every platform:
          - Linux (GTK4): AppImage, .deb, .rpm and tarball
          - Windows (Win32): amd64 and arm64 zips
          - macOS (Cocoa): amd64 and arm64 .app zips

          Build with -tags gtk (Linux GTK4), -tags qt (Linux Qt 6),
          -tags win32 (Windows) or -tags cocoa (macOS)."
          gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && EXISTS=1 || EXISTS=0
          if [ "$EXISTS" = "1" ]; then
            gh release edit "${TAG}" --repo "$GITHUB_REPOSITORY" --notes "${DESCRIPTION}"
          else
            if [ "$IS_DEV" = "true" ]; then
              gh release create "${TAG}" --repo "$GITHUB_REPOSITORY" --title "Dev build ${VERSION}" --notes "${DESCRIPTION}" --prerelease
            else
              gh release create "${TAG}" --repo "$GITHUB_REPOSITORY" --title "GoDucky GUI v${VERSION}" --notes "${DESCRIPTION}"
            fi
          fi
          gh release upload "${TAG}" --repo "$GITHUB_REPOSITORY" dist/* --clobber