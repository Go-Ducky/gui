name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_dev: ${{ steps.version.outputs.is_dev }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine version and tag
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
            IS_DEV="false"
          else
            SHORT="$(git rev-parse --short HEAD)"
            BASE="$(cat VERSION 2>/dev/null || echo 0.1.0)"
            VERSION="${BASE}-dev.${SHORT}"
            TAG="dev-${SHORT}"
            IS_DEV="true"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_dev=${IS_DEV}" >> "$GITHUB_OUTPUT"

  #############################################################################
  # Linux: native GTK4 binary (amd64)
  #############################################################################
  linux:
    name: Package Linux (GTK4)
    needs: version
    runs-on: ubuntu-24.04
    # Arch rolling image: glib exposes the symbols gotk4 needs as real
    # functions (Ubuntu's glib 2.80 still ships them as macros that Go
    # 1.24+'s stricter cgo cannot resolve).
    container:
      image: docker.io/library/archlinux:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install GTK4 build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git glib2 gobject-introspection gtk4

      - name: Build native GTK4 binary
        run: |
          go build -tags gtk -trimpath -ldflags "-s -w" -o bin/goducky-linux-amd64 .

      - name: Assemble release tarball
        run: |
          mkdir -p dist/stage/usr/bin dist/stage/usr/share/applications dist/stage/usr/share/icons/hicolor/128x128/apps
          install -m755 bin/goducky-linux-amd64 dist/stage/usr/bin/goducky
          install -m644 packaging/linux/goducky.desktop dist/stage/usr/share/applications/goducky.desktop
          install -m644 packaging/linux/goducky.png dist/stage/usr/share/icons/hicolor/128x128/apps/goducky.png
          cp bin/goducky-linux-amd64 "dist/goducky-linux-amd64"
          tar -C dist/stage -czf "dist/goducky-${VERSION}-linux-x86_64.tar.gz" usr
          rm -rf dist/stage
          ls -la dist
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*

  #############################################################################
  # Combine, checksum, and publish the release
  #############################################################################
  publish:
    name: Publish release
    needs: [version, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          IS_DEV: ${{ needs.version.outputs.is_dev }}
        run: |
          set -euo pipefail
          DESCRIPTION="GoDucky GUI v${VERSION}

          Native Linux build (GTK4). Build with -tags qt for the Qt 6 frontend.
          The tarball unpacks into /usr (usr/bin/goducky, .desktop, icon).

          macOS (Cocoa) and Windows (Win32) installers resume once those native
          backends ship."
          gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && EXISTS=1 || EXISTS=0
          if [ "$EXISTS" = "1" ]; then
            gh release edit "${TAG}" --repo "$GITHUB_REPOSITORY" --notes "${DESCRIPTION}"
          else
            if [ "$IS_DEV" = "true" ]; then
              gh release create "${TAG}" --repo "$GITHUB_REPOSITORY" --title "Dev build ${VERSION}" --notes "${DESCRIPTION}" --prerelease
            else
              gh release create "${TAG}" --repo "$GITHUB_REPOSITORY" --title "GoDucky GUI v${VERSION}" --notes "${DESCRIPTION}"
            fi
          fi
          gh release upload "${TAG}" --repo "$GITHUB_REPOSITORY" dist/* --clobber